# 构建「中文可见」的 SolidCraft APK
#
# 用途：在 GitHub 的云端 runner 上编译 android 分支的 Rust .so 并打包成 APK，
#       其中 crates/ui-egui 已通过 patch/0001 把子集化的 Noto Sans SC 编入二进制，
#       因此 Android 上切到「中文」界面不再是满屏方框。
#
# 前置：本仓库（fork）已应用 patch/0001-android-bundled-chinese-font.patch，
#       且 crates/ui-egui/assets/fonts/NotoSansSC-Regular-subset.ttf 已提交。
#
# 触发：Actions 页面 → 本工作流 → Run workflow；或推送 v*-zh* 标签。
#
# 说明（踩过的坑，别改回去）：
#   1. 不要用 android-actions/setup-android —— 它内部执行 `sdkmanager tools`，
#      而 `tools` 包已被 Google 从 SDK 仓库删除，该 action 会直接失败（实测 run 40626779775）。
#      Ubuntu runner 自带 Android SDK 与 cmdline-tools，直接用它即可。
#   2. compileSdk = 37 在 SDK 仓库里没有裸 `platforms;android-37`，只有 37.0 / 37.1 / 37.2。
#   3. 上游 gradle.properties 把临时目录写成 Windows 路径 D:/SolidCraftAndroid/tmp，Linux 上必须清掉。

name: 构建中文版 APK

on:
  workflow_dispatch:
    inputs:
      abis:
        description: '目标 ABI（逗号分隔，手机用 arm64-v8a；模拟器加 x86_64）'
        required: false
        default: 'arm64-v8a'
      version_name:
        description: 'versionName（留空则沿用 gradle 里的值）'
        required: false
        default: '0.22.1-zh1'
  push:
    tags:
      - 'v*-zh*'

concurrency:
  group: android-zh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: 编译 .so 并打包 APK
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK 与 NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT" || { echo "::error::找不到 Android SDK：$SDK_ROOT"; exit 1; }
          echo "SDK 根目录：$SDK_ROOT"

          # 找 sdkmanager：PATH → SDK 自带 cmdline-tools → 兜底下载
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "::warning::未找到 sdkmanager，下载 commandline-tools"
            curl -sSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdtools/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager：$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

          # cargo-ndk 需要一个具体 NDK；r27b 长期支持且与 rustc 的 android target 兼容
          "$SDKMANAGER" --install "ndk;27.2.12479018" > /dev/null
          # API 37 只有 37.0/37.1/37.2；build-tools 36.0.0 在仓库里确认存在
          "$SDKMANAGER" --install "platforms;android-37.0" "build-tools;36.0.0" > /dev/null 2>&1 || true

          NDK="$SDK_ROOT/ndk/27.2.12479018"
          test -d "$NDK" || { echo "::error::NDK 未安装：$NDK"; exit 1; }
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
            echo "ANDROID_NDK_HOME=$NDK"
            echo "ANDROID_NDK_ROOT=$NDK"
          } >> "$GITHUB_ENV"

          echo "----- platforms -----"; ls "$SDK_ROOT/platforms" 2>/dev/null || true
          echo "----- build-tools -----"; ls "$SDK_ROOT/build-tools" 2>/dev/null || true
          echo "----- ndk -----"; ls "$SDK_ROOT/ndk" 2>/dev/null || true

      - name: 安装 Rust 与 Android 编译目标
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - name: 安装 cargo-ndk
        run: |
          set -euo pipefail
          # 不锁大版本：锁死 ^3 会在 crates.io 上主版本前进后装不上
          cargo install cargo-ndk --locked
          cargo ndk --version

      - name: 缓存 Cargo 依赖与构建产物
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: solidcraft-android

      - name: 清理 gradle.properties 里的 Windows 专用路径
        run: |
          set -euo pipefail
          sed -i 's#-Djava.io.tmpdir=[^ ]*##g' android/gradle.properties
          sed -i 's#org.gradle.jvmargs=#org.gradle.jvmargs=-Xmx3g #' android/gradle.properties
          sed -i 's#org.gradle.workers.max=.*#org.gradle.workers.max=4#' android/gradle.properties
          echo "----- android/gradle.properties -----"
          cat android/gradle.properties

      - name: 确认内置中文字体已就位
        run: |
          set -euo pipefail
          FONT=crates/ui-egui/assets/fonts/NotoSansSC-Regular-subset.ttf
          test -f "$FONT" || { echo "::error::缺少内置字体 $FONT（先应用 patch/0001 并提交字体文件）"; exit 1; }
          ls -l "$FONT"
          grep -q 'BUNDLED_CHINESE_FONT' crates/ui-egui/src/fonts.rs \
            || { echo "::error::crates/ui-egui/src/fonts.rs 未打上 BUNDLED_CHINESE_FONT 补丁"; exit 1; }
          echo "内置字体与补丁均在位"

      - name: 编译 Rust 动态库（cargo-ndk）
        run: |
          set -euo pipefail
          ABIS="${{ github.event.inputs.abis }}"
          ABIS="${ABIS:-arm64-v8a}"
          echo "目标 ABI：$ABIS  |  NDK：${ANDROID_NDK_HOME}"
          cargo ndk -t "$ABIS" -o android/app/src/main/jniLibs build \
            -p solidcraft-android --profile android-small
          echo "----- jniLibs -----"
          find android/app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: 可选：改写 APK 版本号
        run: |
          set -euo pipefail
          VN="${{ github.event.inputs.version_name }}"
          if [ -n "$VN" ]; then
            sed -i "s/versionName = \".*\"/versionName = \"$VN\"/" android/app/build.gradle.kts
            sed -i 's/versionCode = [0-9]*/versionCode = 2301/' android/app/build.gradle.kts
            grep -n 'versionName\|versionCode' android/app/build.gradle.kts
          fi

      - name: 构建 APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 收集 APK
        run: |
          set -euo pipefail
          mkdir -p out
          find android/app/build -name '*.apk' -exec cp -v {} out/ \;
          ls -lh out/
          for f in out/*.apk; do sha256sum "$f"; done

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: solidcraft-zh-apk
          path: out/*.apk
          if-no-files-found: error
          retention-days: 30
